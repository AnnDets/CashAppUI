name: Mirroring

on:
  push:
  delete:
  workflow_dispatch:

jobs:
  to_gitlab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Configure GitLab SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.GITLAB_SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan gitlab.com >> ~/.ssh/known_hosts

      - name: Force mirror to GitLab
        run: |
          git remote add gitlab git@gitlab.com:Kabaye/cash-app-ui.git
          git push --force --prune gitlab "refs/remotes/origin/*:refs/heads/*"
          git push --force --tags gitlab
